<!DOCTYPE html>

<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Мой AI-бот</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .description {
      color: #666;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .chat-box {
      background: white;
      border-radius: 20px;
      padding: 20px;
      min-height: 500px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .chat-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .chat-text {
      color: #777;
    }

    @media (max-width: 600px) {
      body {
        padding: 15px;
      }

      h1 {
        font-size: 32px;
      }

      .description {
        font-size: 16px;
      }

      .chat-box {
        min-height: 450px;
        border-radius: 15px;
      }
    }
  </style>

</head>

<body>

  <div class="container">

```
<h1>🤖 Мой AI-бот</h1>

<p class="description">
  Задавай вопросы — мой бот постарается помочь.
</p>

<div class="chat-box">
  <div class="chat-title">Чат с ботом</div>
  <p class="chat-text">
    Открой чат в правом нижнем углу 👇
  </p>
</div>
```

  </div>

  <!-- Botpress -->

  <script src="https://cdn.botpress.cloud/webchat/v5.0/inject.js"></script>

  <script
    src="https://files.bpcontent.cloud/2026/09/25/05/20260925050337-U3GDQZXI.js"
    defer>
  </script>

</body>
</html>
