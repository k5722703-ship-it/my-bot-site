<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Assistant</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Inter, Arial, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
    background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
    color:white;
}

.container{
    width:100%;
    max-width:900px;
    text-align:center;
}

h1{
    font-size:56px;
    margin-bottom:15px;
}

.description{
    font-size:20px;
    color:#d1d5db;
    margin-bottom:30px;
}

.chat-box{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:24px;
    padding:40px;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
}

.chat-title{
    font-size:28px;
    font-weight:bold;
    margin-bottom:20px;
}

.chat-text{
    color:#e5e7eb;
    line-height:1.8;
    font-size:18px;
}

.open-btn{
    margin-top:30px;
    padding:15px 35px;
    font-size:18px;
    border:none;
    border-radius:14px;
    cursor:pointer;
    background:white;
    color:#111827;
    font-weight:600;
    transition:.3s;
}

.open-btn:hover{
    transform:translateY(-2px);
}

@media(max-width:600px){

h1{
    font-size:38px;
}

.description{
    font-size:16px;
}

.chat-box{
    padding:25px;
}

.chat-title{
    font-size:22px;
}
}
</style>

</head>
<body>

<div class="container">

    <h1>🚀 AI Assistant</h1>

    <p class="description">
        Умный помощник на базе искусственного интеллекта.
        Задавайте вопросы и получайте ответы мгновенно.
    </p>

    <div class="chat-box">

        <div class="chat-title">
            Ваш персональный AI-помощник
        </div>

        <div class="chat-text">
            ✓ Ответы на вопросы<br>
            ✓ Помощь с учебой<br>
            ✓ Написание текстов<br>
            ✓ Программирование<br>
            ✓ Генерация идей<br>
            ✓ Решение повседневных задач
        </div>

        <button class="open-btn" onclick="window.botpress.open()">
            Открыть чат
        </button>

    </div>

</div>

<!-- Botpress Webchat v5 -->
<script src="https://cdn.botpress.cloud/webchat/v5.0/inject.js"></script>

<script src="https://files.bpcontent.cloud/2026/09/25/05/20260925050337-U3GDQZXI.js" defer></script>

<script>
window.addEventListener('load', () => {
    setTimeout(() => {
        if(window.botpress){
            window.botpress.open();
        }
    }, 1200);
});
</script>

</body>
</html>
